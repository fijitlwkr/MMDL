model:
  repo_id: Qwen/Qwen3-VL-4B-Instruct
  revision: ebb281ec70b05090aa6165b016eac8ec08e71b17
  dtype: bfloat16
dataset:
  repo_id: MMMU/MMMU
  revision: 98e6ac0cb9b7b2cd2c991b85a50762edc4aedc68
  split: validation
  expected_rows_per_subject: 30
  expected_total_rows: 900
  subjects:
    - Accounting
    - Agriculture
    - Architecture_and_Engineering
    - Art
    - Art_Theory
    - Basic_Medical_Science
    - Biology
    - Chemistry
    - Clinical_Medicine
    - Computer_Science
    - Design
    - Diagnostics_and_Laboratory_Medicine
    - Economics
    - Electronics
    - Energy_and_Power
    - Finance
    - Geography
    - History
    - Literature
    - Manage
    - Marketing
    - Materials
    - Math
    - Mechanical_Engineering
    - Music
    - Pharmacy
    - Physics
    - Psychology
    - Public_Health
    - Sociology
environment:
  expected_packages:
    python: "3.12.3"
    torch: "2.8.0+cu128"
    vllm: "0.11.0"
    transformers: "4.57.1"
    tokenizers: "0.22.2"
  min_driver_major: 580
  env_vars:
    VLLM_ENABLE_V1_MULTIPROCESSING: "0"
    VLLM_WORKER_MULTIPROC_METHOD: "spawn"
    TOKENIZERS_PARALLELISM: "false"
prompt:
  verified: true
  source:
    repo: https://github.com/QwenLM/Qwen3-VL
    path: evaluation/mmmu/run_mmmu.py
    commit: f8dca99056bb6352cf6ab36d4ea1848a09c54b5b
    license: Apache-2.0
sampling:
  do_sample: true
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.0
  presence_penalty: 1.5
  seed: 3407
  engine_seed: 3407
  skip_special_tokens: true
  # Pinned model card (VL): https://huggingface.co/Qwen/Qwen3-VL-4B-Instruct/blob/ebb281ec70b05090aa6165b016eac8ec08e71b17/README.md
  # GitHub README (Instruct): https://github.com/QwenLM/Qwen3-VL/blob/main/README.md
  # MMMU script: https://github.com/QwenLM/Qwen3-VL/blob/f8dca99056bb6352cf6ab36d4ea1848a09c54b5b/evaluation/mmmu/run_mmmu.py
  # Sampling values match both README sources and the script, except the script sets no seed in SamplingParams.
  # The script fixes LLM seed to 42; this configuration uses engine_seed 3407.
  # Model card recommends out_seq_length=16384; GitHub README and script default to 32768.
  # The team's max_new_tokens remains 8192; it is intentionally shorter than both recommendations.
budget:
  max_model_len: 16384
  max_new_tokens: 8192
  prompt_safety_margin: 128
image:
  min_pixels: 1003520
  max_pixels: 4014080
  image_patch_size: 16
engine:
  gpu_memory_utilization: 0.9
  limit_mm_per_prompt: {image: 10, video: 0}
run:
  chunk_size: 64
  raw_filename: raw.jsonl
  env_filename: env.json
schema:
  version: "0"
reproducibility_note: >
  seed를 고정해도 vLLM의 배치 구성, GPU, 라이브러리 버전에 따라 출력이 bit 단위로 재현되지는 않는다.
